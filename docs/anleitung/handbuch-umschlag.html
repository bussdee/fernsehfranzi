<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>FernsehFranzi – Das Handbuch</title>
<style>
  @page { size: A4; margin: 0; }
  html, body { margin: 0; }
  body { font-family: "DejaVu Sans", sans-serif; }
  .seite { width: 210mm; height: 297mm; box-sizing: border-box; position: relative; overflow: hidden;
           background: linear-gradient(160deg, #0f1c3d 0%, #1b2a5a 45%, #3a2a6b 100%); color: #fff; }
  .oben { padding: 34mm 22mm 0; }
  .klein { letter-spacing: 3.5mm; font-size: 10pt; color: #9fb3e6; font-weight: 700; }
  h1 { font-size: 54pt; margin: 4mm 0 2mm; letter-spacing: -1px; }
  .unter { font-size: 17pt; color: #d7def5; margin: 0; }
  .bild { margin: 18mm 22mm 0; border-radius: 6mm; overflow: hidden; border: 1.2mm solid rgba(255,255,255,.18);
          box-shadow: 0 6mm 18mm rgba(0,0,0,.45); }
  .bild img { width: 100%; display: block; }
  .symbole { font-size: 30pt; margin: 14mm 22mm 0; letter-spacing: 6mm; }
  .unten { position: absolute; left: 22mm; right: 22mm; bottom: 20mm; display: flex; justify-content: space-between;
           font-size: 10pt; color: #b8c4e8; border-top: 0.4mm solid rgba(255,255,255,.25); padding-top: 4mm; }
</style>
</head>
<body>
<div class="seite">
  <div class="oben">
    <div class="klein">HOME ENTERTAINMENT FÜR KINDER</div>
    <h1>FernsehFranzi</h1>
    <p class="unter">Das Handbuch für die ganze Familie</p>
  </div>
  <div class="bild"><img src="../bilder/startseite.png" alt=""></div>
  <div class="symbole">🎬 🎮 🎸 📚 🌙</div>
  <div class="unten"><span>Bedienen · Einstellen · Spielen · Technik</span><span>Version 5.0</span></div>
</div>
</body>
</html>
