# FernsehFranzi - Rueckfallweg B fuer RetroPie (nur wenn Weg A am Geraet nicht klappt).
# Wird von install/system.sh als Drop-in installiert:
#   /etc/systemd/system/fernsehfranzi-retropie.service.d/weg-b.conf
# Weg B (wie in V1 bewaehrt): Der Desktop (lightdm, labwc, Chromium) wird fuer das Spielen
# beendet, damit EmulationStation die Grafik sicher allein hat. Danach startet er neu
# (15-25 s bis zur Startseite), auf der Konsole steht so lange ein Hinweis.
[Unit]
Conflicts=lightdm.service
After=lightdm.service

[Service]
# Laeuft nach "vt.sh zurueck" aus der Haupt-Unit (Konsole ist dann wieder die des Desktops).
ExecStopPost=+/bin/sh -c 'printf "\\033[2J\\033[H\\033[?25l\\n\\n\\n      Einen Moment - die Startseite kommt gleich ...\\n" > /dev/tty7'
ExecStopPost=+/usr/bin/systemctl start --no-block lightdm.service
